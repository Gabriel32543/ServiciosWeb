<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Servicios Personales - Contacto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

  <!-- Menú de navegación -->
  <header>
    <nav class="bg-blue-600 p-4 text-white flex justify-center space-x-6 shadow-md">
      <a href="index.html" class="hover:underline">Inicio</a>
      <a href="servicios.html" class="hover:underline">Servicios</a>
      <a href="contacto.html" class="hover:underline font-bold">Contacto</a>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="flex-grow max-w-md mx-auto p-10 bg-white rounded-lg shadow-md mt-10">
    <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center">Contáctanos</h1>

    <!-- Formulario (usa Formspree para funcionar sin backend) -->
    <form action="https://formspree.io/f/maylnqdp" method="POST" class="space-y-4">
      <input type="text" name="name" placeholder="Tu nombre" required
             class="w-full border border-gray-300 rounded px-3 py-2" />

      <input type="email" name="email" placeholder="Tu correo electrónico" required
             class="w-full border border-gray-300 rounded px-3 py-2" />

      <textarea name="message" placeholder="Escribe tu mensaje" required
                class="w-full border border-gray-300 rounded px-3 py-2 h-28 resize-none"></textarea>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300">
        Enviar mensaje
      </button>
    </form>
  </main>

  <footer class="bg-blue-600 text-white text-center py-4 mt-auto">
    © 2025 Servicios Personales. Todos los derechos reservados.
  </footer>

</body>
</html>
